name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      UV_PYTHON: ${{ matrix.python }}
      OHRA_POSTGRES_DSN: postgresql://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no major tags since v8
      - run: uv sync --all-extras --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24   # the Dockerfile's node:24-slim
      - run: npx --yes esbuild@0.28.2 src/ohra/ext/clock.ts --format=esm --outfile=src/ohra/ext/clock.js   # the tests and the apps serve clock.js
      - run: npm ci && npm run build   # the game's type check and build; the page tests use dist/
        working-directory: examples/relay_rally
      - run: uv run pytest
      - run: uv run pytest examples/testing   # the book's chapter 12 tests
      - run: uv run pytest examples/streams   # the book's chapter 13 tests
      - run: uv run pytest examples/distributed_data   # the book's chapter 14 tests
      - run: npx --yes -p typescript@7.0.2 tsc --noEmit --strict --target es2022 --lib es2022,dom src/ohra/ext/clock.ts
      # the release's build of clock.js, rehearsed
      - name: Build clock.js from clock.ts, minified, and clock.d.ts for TypeScript pages
        run: |
          npx --yes esbuild@0.28.2 src/ohra/ext/clock.ts --minify --format=esm --outfile=src/ohra/ext/clock.js
          npx --yes -p typescript@7.0.2 tsc --declaration --emitDeclarationOnly --strict --target es2022 --lib es2022,dom src/ohra/ext/clock.ts
      - run: node tests/clock_js_check.mjs   # the release's minified clock.js still works
