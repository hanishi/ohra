name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no major tags since v8
      - name: Check that the tag matches the version in pyproject.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Build clock.js from clock.ts, minified, and clock.d.ts for TypeScript pages
        run: |
          npx --yes esbuild@0.28.2 src/ohra/ext/clock.ts --minify --format=esm --outfile=src/ohra/ext/clock.js
          npx --yes -p typescript@7.0.2 tsc --declaration --emitDeclarationOnly --strict --target es2022 --lib es2022,dom src/ohra/ext/clock.ts
      - run: node tests/clock_js_check.mjs   # a broken minification fails the release here
      - run: uv build   # the sdist ships the built files too, so installing it needs no node
      - name: Check that the sdist and the wheel ship clock.js minified, and clock.d.ts
        run: |
          test "$(unzip -p dist/*.whl ohra/ext/clock.js | wc -l)" -eq 1
          test "$(tar -xOzf dist/*.tar.gz --wildcards '*/src/ohra/ext/clock.js' | wc -l)" -eq 1
          unzip -l dist/*.whl ohra/ext/clock.d.ts
          tar -tzf dist/*.tar.gz --wildcards '*/src/ohra/ext/clock.d.ts'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ohra/
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, no API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
