# Shopping carts on a three-pod cluster: FastAPI on every pod, the carts spread over the pods by cluster sharding and
# persisted in one Postgres database that every pod reaches. Replace IMAGE with your image, see
# docs/book/08-management-and-kubernetes.md, "Carts".
apiVersion: v1
kind: Secret
metadata:
  name: carts-postgres
stringData:
  password: carts-example-only   # an example; use your own secret outside a local cluster
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: carts
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carts-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # a subdirectory: the volume's root is not empty
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "carts"]
            periodSeconds: 5
  volumeClaimTemplates:          # Docker Desktop's default storage class provides it; it outlives the pods
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: carts-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carts-pod-reader
subjects:
  - kind: ServiceAccount
    name: carts
roleRef:
  kind: Role
  name: carts-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
spec:
  replicas: 3
  selector:
    matchLabels:
      app: carts              # what KubernetesApiServiceDiscovery looks up: app=<service_name>
  template:
    metadata:
      labels:
        app: carts
    spec:
      serviceAccountName: carts
      imagePullSecrets:
        - name: regcred             # for a private hub repository; harmless when the secret does not exist
      terminationGracePeriodSeconds: 30   # room for uvicorn to drain, then the carts to hand off and the pod to leave
      initContainers:
        - name: wait-for-postgres   # the store's pool would give up after 30 s and the pod would restart
          image: postgres:17
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres -d carts; do sleep 1; done"]
      containers:
        - name: carts
          image: IMAGE
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "carts:app", "--app-dir", "examples/k8s", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
            - name: remoting
              containerPort: 2551
            - name: management        # the bootstrap's port_name
              containerPort: 7626
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carts-postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/carts
          readinessProbe:
            httpGet:
              path: /ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: management
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: carts
spec:
  type: LoadBalancer          # Docker Desktop publishes it on localhost:8000
  selector:
    app: carts
  ports:
    - name: http
      port: 8000
      targetPort: http
