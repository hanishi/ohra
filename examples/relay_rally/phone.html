<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Relay Rally</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  form { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; font: 700 18px ui-monospace, monospace; color: #39ff6a;
    text-shadow: 0 0 8px #39ff6a; z-index: 5; background: #000; }
  form input, form button { font: inherit; color: #39ff6a; background: #000;
    border: 2px solid #39ff6a; padding: 10px 14px; text-transform: uppercase;
    box-shadow: 0 0 10px #39ff6a55; text-align: center; }
  form input { width: 12ch; }
  form button { cursor: pointer; }
  form[hidden] { display: none; }
  #tilt { position: fixed; left: 8px; bottom: 6px; z-index: 6; pointer-events: none;
    font: 11px ui-monospace, monospace; color: #39ff6a99; }
</style>
</head>
<body>
<form id="join">
  <div>RELAY RALLY</div>
  <label for="name">YOUR NAME</label>
  <input id="name" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button>JOIN</button>
</form>
<canvas id="court"></canvas>
<div id="tilt"></div>
<script type="module" src="/src/phone.ts"></script>
</body>
</html>
