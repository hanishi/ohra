<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Rally</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #controls { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 1.2em; align-items: center; }
  #controls[hidden] { display: none; }
  button { font: 700 clamp(18px, 3vw, 36px) ui-monospace, monospace; color: #39ff6a; background: #000;
    border: 3px solid #39ff6a; padding: 0.4em 1.4em; text-shadow: 0 0 10px #39ff6a;
    box-shadow: 0 0 18px #39ff6a66; cursor: pointer; }
  button:disabled { color: #0d3a1a; border-color: #0d3a1a; text-shadow: none; box-shadow: none;
    cursor: default; }
  button.cpu { font-size: clamp(14px, 2vw, 24px); padding: 0.4em 0.8em; }
</style>
<!-- the join code; the only third-party script in the example -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<canvas id="wall"></canvas>
<div id="controls" hidden>
  <button id="less" class="cpu" disabled>&minus;CPU</button>
  <button id="start" disabled>START</button>
  <button id="more" class="cpu">+CPU</button>
</div>
<script type="module" src="/src/wall.ts"></script>
</body>
</html>
