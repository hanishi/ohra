<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Rally</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 5;
    font: 700 clamp(18px, 3vw, 36px) ui-monospace, monospace; color: #39ff6a; background: #000;
    border: 3px solid #39ff6a; padding: 0.4em 1.4em; text-shadow: 0 0 10px #39ff6a;
    box-shadow: 0 0 18px #39ff6a66; cursor: pointer; }
  button:disabled { color: #0d3a1a; border-color: #0d3a1a; text-shadow: none; box-shadow: none;
    cursor: default; }
  button[hidden] { display: none; }
</style>
<!-- the join code; the only third-party script in the example -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<canvas id="wall"></canvas>
<button id="start" hidden disabled>START</button>
<script type="module">
  import { connect } from "/ohra/clock.js";
  import { blip, crt, fit, glow, heart, text, unlock, DIM, GREEN } from "/arcade.js";

  const canvas = document.getElementById("wall");
  const ctx = canvas.getContext("2d");
  const start = document.getElementById("start");
  crt();

  let state = null;
  let passes = []; // {from, to, t0, t1}, kept a little after they land
  let qr = null; // the join code's modules, rows of booleans
  let joinUrl = "";

  fetch("/join").then((r) => r.json()).then(({ url }) => {
    joinUrl = url;
    if (typeof qrcode !== "function") return; // offline: the URL alone still works
    const code = qrcode(0, "M");
    code.addData(url);
    code.make();
    const n = code.getModuleCount();
    qr = Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => code.isDark(r, c)));
  });

  const conn = connect("/ws/wall", (m) => {
    if (m.type === "state") {
      state = m;
      if (m.phase !== "playing") passes = [];
      const here = m.players.filter((p) => p.connected).length;
      start.hidden = m.phase !== "lobby";
      start.disabled = here < 2;
    } else if (m.type === "pass") {
      passes.push(m);
      conn.at(m.t1, () => blip(520, 0.05, 0.1));
    }
  });

  start.addEventListener("click", () => {
    unlock();
    conn.send({ type: "start" });
  });

  // Where each player sits on the wall: around an ellipse, in join order.
  function seats(w, h) {
    const players = state.players.filter((p) => p.in_game);
    return new Map(players.map((p, i) => {
      const a = -Math.PI / 2 + (i / players.length) * 2 * Math.PI;
      return [p.id, { p, x: w / 2 + Math.cos(a) * w * 0.36, y: h * 0.52 + Math.sin(a) * h * 0.3 }];
    }));
  }

  function frame() {
    requestAnimationFrame(frame);
    const { w, h } = fit(canvas);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    const px = Math.max(2, Math.round(Math.min(w, h) / 160));
    if (!state) return text(ctx, "CONNECTING", w / 2, h / 2, px * 2, GREEN, "center");
    if (state.phase === "lobby") return lobby(w, h, px);
    if (state.phase === "over") return over(w, h, px);
    playing(w, h, px);
  }

  function lobby(w, h, px) {
    text(ctx, "RELAY RALLY", w / 2, h * 0.08, px * 3, GREEN, "center");
    const size = Math.min(w * 0.35, h * 0.5);
    if (qr) {
      const m = size / (qr.length + 4); // with a quiet zone
      const x0 = w * 0.08, y0 = h * 0.24;
      glow(ctx, GREEN, 0);
      ctx.fillRect(x0, y0, size, size); // a lit background, dark modules: phones read it
      ctx.fillStyle = "#000";
      qr.forEach((row, r) => row.forEach((dark, c) => {
        if (dark) ctx.fillRect(x0 + (c + 2) * m, y0 + (r + 2) * m, Math.ceil(m), Math.ceil(m));
      }));
    }
    text(ctx, "SCAN TO JOIN", w * 0.08 + size / 2, h * 0.24 + size + 3 * px, px, GREEN, "center");
    ctx.font = `${3 * px}px ui-monospace, monospace`; // a URL has characters the pixel font lacks
    glow(ctx, GREEN, 6);
    ctx.textAlign = "center";
    ctx.fillText(joinUrl, w * 0.08 + size / 2, h * 0.24 + size + 14 * px);
    const x = w * 0.62;
    text(ctx, `PLAYERS ${state.players.filter((p) => p.connected).length}`, x, h * 0.24, px * 2, GREEN);
    state.players.forEach((p, i) => {
      text(ctx, p.name, x, h * 0.24 + (i + 1.6) * 9 * px, px * 1.5, p.connected ? p.color : DIM);
    });
  }

  function playing(w, h, px) {
    const now = conn.now();
    const at = seats(w, h);
    const left = Math.max(0, Math.ceil(state.ends_at - now));
    const clock = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    text(ctx, clock, w / 2, h * 0.47, px * 4, left <= 10 ? "#ff5c8a" : GREEN, "center");

    // a phosphor streak along each pass, its head where the puck is in the air
    passes = passes.filter((s) => now < s.t1 + 0.6);
    for (const s of passes) {
      const a = at.get(s.from), b = at.get(s.to);
      if (!a || !b) continue;
      const f = Math.max(0, Math.min(1, (now - s.t0) / (s.t1 - s.t0)));
      const tail = Math.max(0, f - 0.35);
      const lerp = (k) => [a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k];
      const fade = now > s.t1 ? 1 - (now - s.t1) / 0.6 : 1;
      ctx.globalAlpha = 0.8 * fade;
      glow(ctx, a.p.color, 18);
      ctx.lineWidth = px * 1.5;
      ctx.beginPath();
      ctx.moveTo(...lerp(tail));
      ctx.lineTo(...lerp(f));
      ctx.stroke();
      glow(ctx, "#ffffff", 22);
      const [hx, hy] = lerp(f);
      ctx.fillRect(hx - 2 * px, hy - 2 * px, 4 * px, 4 * px);
      ctx.globalAlpha = 1;
    }

    for (const { p, x, y } of at.values()) {
      const color = p.connected ? p.color : DIM;
      ctx.globalAlpha = p.lives > 0 ? 1 : 0.4;
      text(ctx, p.name, x, y - 7 * px, px * 1.5, color, "center");
      for (let i = 0; i < 5; i++) heart(ctx, x - 17 * px + i * 7 * px, y + 2 * px, px, color, i < p.lives);
      ctx.globalAlpha = 1;
    }
  }

  function over(w, h, px) {
    const winners = state.players.filter((p) => state.winners.includes(p.id));
    text(ctx, winners.length > 1 ? "SHARED WIN" : "WINNER", w / 2, h * 0.22, px * 3, GREEN, "center");
    winners.forEach((p, i) => text(ctx, p.name, w / 2, h * 0.4 + i * 14 * px, px * 3, p.color, "center"));
  }

  requestAnimationFrame(frame);
</script>
</body>
</html>
