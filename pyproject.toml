[project]
name = "ohra"
version = "0.3.0"
description = "Apache Pekko Typed style actors on asyncio. Not affiliated with the Apache Software Foundation."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Haruhiko Nishi" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["actors", "asyncio", "pekko", "actor-model", "cluster", "sharding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hanishi/ohra"
Documentation = "https://github.com/hanishi/ohra/tree/main/docs/book"
Issues = "https://github.com/hanishi/ohra/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.380", "httpx>=0.27", "ruff>=0.17"]
numpy = ["numpy>=2.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
torch = ["torch>=2.5", "numpy>=2.0"]
numba = ["numba>=0.68", "numpy>=2.0"]
testkit = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ohra = ["py.typed"]

# The torch extra installs PyTorch's CPU-only build, small enough for CI. Only uv in this
# repository uses this index; pip install ohra[torch] gets the default PyTorch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests/typing_check.py", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "N"]
