[project]
name = "pekko-py"
version = "0.1.0"
description = "Apache Pekko Typed style actors on asyncio. Not affiliated with the Apache Software Foundation."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.380", "httpx>=0.27"]
numpy = ["numpy>=2.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests/typing_check.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportUnnecessaryTypeIgnoreComment = "error"
